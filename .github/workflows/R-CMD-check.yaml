# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # knitr is the VignetteBuilder and testthat/withr run the tests,
          # so the devel leg needs them even with hard dependencies only.
          extra-packages: |
            any::rcmdcheck
            any::knitr
            any::testthat
            any::withr
          # R-devel has no binary package repository, so pak compiles every
          # dependency from source. Installing the full Suggests closure there
          # (tmap, leaflet, gt, osmdata, ...) took over 25 minutes per run and
          # left PR checks pending for hours. Hard dependencies only on that
          # leg; the Suggests closure is still covered by the release legs.
          dependencies: ${{ matrix.config.r == 'devel' && '"hard"' || '"all"' }}

      # With only hard dependencies installed on R-devel, the vignettes'
      # Suggests (ggplot2, tmap, gt, ...) are missing, so skip building and
      # checking vignettes there and don't force Suggests to be present.
      # The release legs still build and check the vignettes in full.
      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.r != 'devel' }}
        with:
          build_args: ${{ matrix.config.r == 'devel' && 'c("--no-manual", "--no-build-vignettes")' || 'c("--no-manual", "--compact-vignettes=gs+qpdf")' }}
          args: ${{ matrix.config.r == 'devel' && 'c("--no-manual", "--as-cran", "--ignore-vignettes")' || 'c("--no-manual", "--as-cran")' }}

      # Coverage used to be a separate workflow that installed the whole
      # dependency closure a second time on every pull request. One leg
      # reports it now, which is enough to notice a regression.
      - name: Test coverage
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: covr::codecov(type = "all", quiet = FALSE)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check
